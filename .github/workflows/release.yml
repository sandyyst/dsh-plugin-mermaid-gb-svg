# 发布到 npm：打 tag（如 v0.1.4）即自动跑测试并发布。
#
# 采用 npm Trusted Publishing（OIDC），**不需要任何 NPM_TOKEN**：
#   1. 打开 https://www.npmjs.com/package/dsh-plugin-mermaid-gb-svg
#      → Settings → Trusted Publisher → 选 GitHub Actions
#        Organization or user : sandyyst
#        Repository            : dsh-plugin-mermaid-gb-svg
#        Workflow filename     : release.yml
#        Environment name      : （留空）
#   2. git tag v0.1.4 && git push --tags
#
# 好处：没有长期 token 可泄漏、不会过期、无需 OTP，且自动生成 provenance 签名。
# 注意：不要设置 NODE_AUTH_TOKEN —— 空的 token 会让 npm 报 404（本仓库踩过一次），
#       走 OIDC 时不设置它才是正确做法。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Trusted Publishing / provenance 必需，勿删
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: 安装开发依赖（peer 依赖由 devDependencies 提供）
        run: npm install --no-audit --no-fund
      - name: 跑测试
        run: npm test
      - name: 发布（OIDC，无需 token）
        run: npm publish --provenance --access public
